name: APK Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # La clé de signature est facultative : sans elle, l'APK est signé avec une clé de test.
      HAS_KEYSTORE: ${{ secrets.VIP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          VIP_KEYSTORE_BASE64: ${{ secrets.VIP_KEYSTORE_BASE64 }}
        run: |
          echo "$VIP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vip-pneus-release.jks"
          echo "VIP_KEYSTORE_FILE=$RUNNER_TEMP/vip-pneus-release.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Construction de l'APK
        env:
          VIP_KEYSTORE_PASSWORD: ${{ secrets.VIP_KEYSTORE_PASSWORD }}
          VIP_KEY_ALIAS: ${{ secrets.VIP_KEY_ALIAS }}
          VIP_KEY_PASSWORD: ${{ secrets.VIP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: vip-pneus-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Rapports de tests et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            app/build/reports/tests/
            app/build/test-output/ecrans/
